	<script>
	function confirmCheck()
                {
					var opendate = document.getElementById("opened_date").value;
					const today = new Date().toISoString().split("T")[0];
					document.getElementById("opened_date").setAttribute("min",today);
					if (opendate>today)
					{
						alert("Invalid Date");
						return false;
					}
                    var custId = document.getElementById("personid").value;
					if (!custId)
					{
						alert("Please enter a person id ");
						return false;
					}
					var openBal = document.getElementById("bal").value;
					if (!openBal || openBal < 0)
					{
						alert("Please enter a valid opening balance ");
						return false;
					}
					else{	
                    var response = confirm('Are you sure you want to submit the form?');
					return response;}
				}
                    </script>
