    <div class="addbody">
     <form action = "addCust.php" method = "post" onsubmit="return validate()">
            <p><label for = "firstname" > First name </label>
            <input type="text" name="firstname" id="firstname" placeholder="first name"
                    autocomplete="off" required/>
            </p>

            <p><label for = "surname" > Surname </label>
            <input type="text" name="surname" id="surname" placeholder=" Surname" required/>
            </p>

            <p><label for = "address" > Address </label>
            <input type="text" name="address" id="address" placeholder=" Address" required />
            </p>

           <p>
            <label for="eircode">Eircode</label>
            <input type="text" name="eircode" id="eircode" placeholder="Eircode" required pattern="[A-Z][0-9]{2}\s?[A-Z0-9]{4}" title="Enter in This Format [A00 A00A]"/>
            </p>

            <p>
            <label for="dob">Date of Birth</label>
            <input type="date" name="dob" id="dob" required/>
            </p>

            <p>
            <label for="telephone">Telephone Number</label>
            <input type="text" name="telephone" id="telephone" placeholder="Telephone" required pattern="[0-9 ]+" title="Enter in This Format [ XXX XXX XXXX ]"/>
            </p>

            <p>
            <label for="occupation">Occupation</label>
            <input type="text" name="occupation" id="occupation" placeholder="Occupation" required/>
            </p>

            <p>
            <label for="salary">Salary</label>
            <input type="text" name="salary" id="salary" placeholder="Salary" required pattern="[0-9]+(\.[0-9]{1,2})?"/>
            </p>

            <p><label for = "email" > Email Address </label>
            <input type="email" name="email" id="email" placeholder=" Email" required/>
            </p>


            <p><label for = "guarantor" > Guarantor Name (if applicable) </label>
            <input type="text" name="guarantor" id="guarantor" placeholder=" Guarantor" required/>
            </p>

            <br>
            <input type="submit" value="Submit"/>
            <input type="reset" value="Clear" />
		 
		 <script>
			function validate()
            {
                var finalConfirmation = confirm("Are you sure you want to submit the form?");
                return finalConfirmation;
            }
		 </script>

            <p>
        </form>
